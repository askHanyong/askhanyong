[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/accuracy"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[edge_functions]]
  path = "/api/claude"
  function = "claude"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Serve landing.html at the root URL (force overrides index.html static file)
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200
  force = true

# /app serves the AI tutor (force ensures it's never caught by the root rewrite)
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200
  force = true

# /accuracy serves the accuracy dashboard
[[redirects]]
  from = "/accuracy"
  to = "/accuracy.html"
  status = 200
  force = true

# /admin serves the admin dashboard
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200
  force = true
