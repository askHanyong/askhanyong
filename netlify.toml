[build]
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[edge_functions]]
  path = "/api/claude"
  function = "claude"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Serve landing.html at the root URL
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 200

# /app is a clean alias for the main app
[[redirects]]
  from = "/app"
  to = "/index.html"
  status = 200
